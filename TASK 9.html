<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Text Content Change</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#11998e,#38ef7d);
        }

        .container{
            width:500px;
            background:#fff;
            padding:40px;
            text-align:center;
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
        }

        h1{
            color:#11998e;
            margin-bottom:20px;
        }

        #message{
            font-size:20px;
            color:#555;
            margin-bottom:25px;
            font-weight:500;
        }

        button{
            padding:12px 28px;
            border:none;
            border-radius:8px;
            background:#11998e;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#0d7d74;
            transform:translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>DOM Manipulation Example</h1>

        <p id="message">
            Welcome to Full Stack Development!
        </p>

        <button onclick="changeText()">
            Change Text
        </button>
    </div>

    <script>
        function changeText() {
            document.getElementById("message").textContent =
            "Text has been successfully changed using JavaScript DOM!";
        }
    </script>

</body>
</html>
