<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Input Validation</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#ff9966,#ff5e62);
        }

        .container{
            width:450px;
            background:#fff;
            padding:35px;
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            border:2px solid #ddd;
            border-radius:8px;
            font-size:16px;
            margin-bottom:15px;
        }

        button{
            padding:12px 25px;
            background:#ff5e62;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#e84c50;
        }

        #message{
            margin-top:15px;
            font-weight:bold;
        }

        .success{
            color:green;
        }

        .error{
            color:red;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Input Validation Form</h1>

        <input type="text" id="username" placeholder="Enter your name">

        <button onclick="validateInput()">
            Validate
        </button>

        <p id="message"></p>
    </div>

    <script>
        function validateInput() {

            let name = document.getElementById("username").value;
            let message = document.getElementById("message");

            if(name.trim() === ""){
                message.textContent = "Name field cannot be empty!";
                message.className = "error";
            }
            else if(name.length < 3){
                message.textContent = "Name must contain at least 3 characters.";
                message.className = "error";
            }
            else{
                message.textContent = "Validation Successful!";
                message.className = "success";
            }
        }
    </script>

</body>
</html>
