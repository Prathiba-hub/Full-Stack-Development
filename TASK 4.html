<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Information Table</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);
            padding:20px;
        }

        .container{
            width:850px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:25px;
        }

        table{
            width:100%;
            border-collapse:collapse;
            overflow:hidden;
            border-radius:12px;
        }

        thead{
            background:#667eea;
            color:white;
        }

        th, td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tbody tr:nth-child(even){
            background:#f8f9fa;
        }

        tbody tr:hover{
            background:#eef2ff;
            transition:0.3s;
        }

        th{
            font-size:16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Student Information Table</h1>

        <table>
            <thead>
                <tr>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Department</th>
                    <th>Year</th>
                    <th>CGPA</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td>101</td>
                    <td>Prathiba</td>
                    <td>Computer Science</td>
                    <td>III</td>
                    <td>8.9</td>
                </tr>

                <tr>
                    <td>102</td>
                    <td>Karishma</td>
                    <td>Information Technology</td>
                    <td>II</td>
                    <td>8.7</td>
                </tr>

                <tr>
                    <td>103</td>
                    <td>Pooja</td>
                    <td>Computer Science</td>
                    <td>III</td>
                    <td>9.1</td>
                </tr>

                <tr>
                    <td>104</td>
                    <td>Sangavi</td>
                    <td>Data Science</td>
                    <td>II</td>
                    <td>8.8</td>
                </tr>
            </tbody>
        </table>
    </div>

</body>
</html>
