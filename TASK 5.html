<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline CSS Example</title>
</head>
<body style="background-color:#f4f7fc; font-family:'Segoe UI', sans-serif; padding:40px;">

    <div style="max-width:700px; margin:auto; background:white; padding:30px; border-radius:15px; box-shadow:0 10px 25px rgba(0,0,0,0.1);">

        <h1 style="color:#4f46e5; font-size:38px; text-align:center;">
            Welcome to Full Stack Development
        </h1>

        <p style="color:#555; font-size:20px; line-height:1.8; text-align:justify;">
            Inline CSS is used to apply styles directly within an HTML element using
            the <strong>style</strong> attribute. It allows developers to quickly
            customize the appearance of text, including color, font size, alignment,
            and other visual properties.
        </p>

    </div>

</body>
</html>
