<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordered and Unordered Lists</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
            padding:20px;
        }

        .container{
            width:700px;
            background:#fff;
            padding:35px;
            border-radius:20px;
            box-shadow:0 12px 30px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            color:#333;
            margin-bottom:30px;
        }

        .list-section{
            display:flex;
            justify-content:space-between;
            gap:30px;
        }

        .card{
            flex:1;
            background:#f8f9fa;
            padding:25px;
            border-radius:15px;
            border-left:5px solid #4facfe;
        }

        h2{
            color:#0077b6;
            margin-bottom:15px;
        }

        li{
            margin:10px 0;
            color:#555;
            line-height:1.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>HTML Lists Example</h1>

        <div class="list-section">

            <!-- Ordered List -->
            <div class="card">
                <h2>Ordered List</h2>
                <ol>
                    <li>Requirement Analysis</li>
                    <li>Design the Website</li>
                    <li>Develop the Application</li>
                    <li>Test the Features</li>
                    <li>Deploy the Project</li>
                </ol>
            </div>

            <!-- Unordered List -->
            <div class="card">
                <h2>Unordered List</h2>
                <ul>
                    <li>HTML</li>
                    <li>CSS</li>
                    <li>JavaScript</li>
                    <li>React</li>
                    <li>Node.js</li>
                </ul>
            </div>

        </div>
    </div>

</body>
</html>
