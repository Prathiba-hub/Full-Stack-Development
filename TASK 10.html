<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Listener Example</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#3a7bd5,#00d2ff);
        }

        .container{
            background:white;
            width:500px;
            padding:40px;
            text-align:center;
            border-radius:20px;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
        }

        h1{
            color:#333;
            margin-bottom:15px;
        }

        p{
            color:#666;
            margin-bottom:25px;
            font-size:18px;
        }

        button{
            padding:12px 30px;
            border:none;
            border-radius:8px;
            background:#3a7bd5;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#2c5fb8;
            transform:translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>JavaScript Event Listener</h1>

        <p id="message">
            Click the button to see the event listener in action.
        </p>

        <button id="myButton">
            Click Me
        </button>
    </div>

    <script>
        // Select the button
        const button = document.getElementById("myButton");

        // Add event listener
        button.addEventListener("click", function() {
            document.getElementById("message").textContent =
            "Button clicked! Event listener executed successfully.";
        });
    </script>

</body>
</html>
