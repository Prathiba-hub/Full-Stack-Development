<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>External CSS Example</title>

    <!-- Linking External CSS File -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>External CSS Demonstration</h1>
        <p>
            This webpage is styled using an external CSS file.
            The styles are stored separately in <strong>style.css</strong>
            and linked to this HTML document.
        </p>

        <button>Learn More</button>
    </div>

</body>
</html>
