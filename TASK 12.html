<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Input Validation</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#4facfe,#00f2fe);
        }

        .container{
            width:450px;
            background:#fff;
            padding:35px;
            border-radius:18px;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
            text-align:center;
        }

        h1{
            color:#333;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            font-size:16px;
            border:2px solid #ccc;
            border-radius:8px;
            outline:none;
            margin-bottom:15px;
            transition:0.3s;
        }

        input:focus{
            border-color:#4facfe;
        }

        button{
            background:#4facfe;
            color:white;
            border:none;
            padding:12px 28px;
            font-size:16px;
            border-radius:8px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#0088cc;
        }

        #result{
            margin-top:18px;
            font-size:17px;
            font-weight:bold;
        }

        .success{
            color:green;
        }

        .error{
            color:red;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Text Input Validation</h1>

        <input type="text" id="username" placeholder="Enter your name">

        <button onclick="validateInput()">Validate</button>

        <p id="result"></p>
    </div>

    <script>

        function validateInput(){

            let username = document.getElementById("username").value;
            let result = document.getElementById("result");

            if(username.trim() === ""){
                result.innerHTML = "❌ Name cannot be empty.";
                result.className = "error";
            }
            else if(username.length < 3){
                result.innerHTML = "❌ Name must contain at least 3 characters.";
                result.className = "error";
            }
            else{
                result.innerHTML = "✅ Validation Successful!";
                result.className = "success";
            }

        }

    </script>

</body>
</html>
