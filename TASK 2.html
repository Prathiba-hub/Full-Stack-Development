<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image & Hyperlink Demo</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg, #1e3c72, #2a5298);
            padding:20px;
        }

        .card{
            background:#ffffff;
            width:420px;
            border-radius:20px;
            overflow:hidden;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
            text-align:center;
        }

        .card img{
            width:100%;
            height:250px;
            object-fit:cover;
        }

        .content{
            padding:25px;
        }

        h1{
            color:#333;
            margin-bottom:12px;
        }

        p{
            color:#666;
            line-height:1.6;
            margin-bottom:20px;
        }

        .btn{
            display:inline-block;
            padding:12px 24px;
            background:#2a5298;
            color:white;
            text-decoration:none;
            border-radius:8px;
            font-weight:600;
            transition:0.3s;
        }

        .btn:hover{
            background:#1e3c72;
            transform:translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1516321318423-f06f85e504b3" 
             alt="Technology Image">

        <div class="content">
            <h1>Web Development</h1>
            <p>
                Explore the world of modern web technologies and
                build interactive, responsive websites with ease.
            </p>

            <a href="https://www.w3schools.com" target="_blank" class="btn">
                Learn More
            </a>
        </div>
    </div>

</body>
</html>
